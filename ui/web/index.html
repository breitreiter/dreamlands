<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&family=Alegreya+Sans:wght@400;500;700&family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&family=Sue+Ellen+Francisco&display=swap" rel="stylesheet" />
    <title>The Merchant</title>
    <meta name="description" content="Carry cargo between the settlements of a world that does not want you to survive the trip. An unfinished alpha build." />

    <!-- Social cards. og:image must be absolute; crawlers do not resolve relative
         paths. X caches card images hard, so the filename carries a version
         suffix. Bump it (and these tags) rather than overwriting in place. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Merchant" />
    <meta property="og:url" content="https://merchant.dreamlands.org/" />
    <meta property="og:title" content="The Merchant" />
    <meta property="og:description" content="Carry cargo between the settlements of a world that does not want you to survive the trip. An unfinished alpha build." />
    <meta property="og:image" content="https://merchant.dreamlands.org/og-card-v1.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A domed city of pale spires under a dense starfield, titled The Merchant." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Merchant" />
    <meta name="twitter:description" content="Carry cargo between the settlements of a world that does not want you to survive the trip. An unfinished alpha build." />
    <meta name="twitter:image" content="https://merchant.dreamlands.org/og-card-v1.jpg" />
    <meta name="twitter:image:alt" content="A domed city of pale spires under a dense starfield, titled The Merchant." />
